name: Auto Sync Fork

on:
  schedule:
    # Berjalan otomatis setiap 6 jam
    - cron: '0 */6 * * *'
  # Memungkinkan sync manual dari tab Actions
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync upstream changes
        uses: a2ren/fork-sync-action@v1.0.0
        with:
          upstream_repository: YuKongA/ghostlock-app
          upstream_branch: main
          target_branch: main
          git_pull_args: '--rebase'
